<!-- @dsCard group="Brand" viewport="700x150" name="Focus treatment" subtitle="Apricot ring, 3px, offset 3px — the same colour as "you are here"" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:20px}
.sw{height:76px;border-radius:4px}.lb{margin:8px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);line-height:1.5}
.row{display:grid;gap:12px}</style></head><body>
<div style="display:flex;gap:22px;align-items:center">
<div style="background:var(--action-primary);color:var(--action-primary-text);padding:14px 26px;border-radius:var(--radius-card);font-weight:700;font-size:15px;outline:3px solid var(--focus-ring);outline-offset:3px">Focused</div>
<div style="background:var(--surface-card);border:1.5px solid var(--focus-ring);border-radius:var(--radius-card);padding:14px 16px;outline:3px solid var(--focus-ring-wash);font-size:16px;color:var(--text-strong)">Kyoto</div>
</div></body></html>
