<!-- @dsCard group="Colors" viewport="700x150" name="Accent & state" subtitle="Apricot means &quot;you are here&quot;; plum means destination" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:20px;color:var(--text-strong)}
a{color:var(--wend-leaf)}a:hover{opacity:.7}
.lb{margin:8px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);line-height:1.5}
.sw{height:56px;border-radius:3px}
.h{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin:0 0 10px}
.row{display:grid;gap:12px}</style></head><body>
<div class="row" style="grid-template-columns:repeat(4,1fr)">
<div><div class="sw" style="background:var(--wend-apricot)"></div><p class="lb">Apricot<br>#E89A5E · non-text only</p></div>
<div><div class="sw" style="background:var(--wend-plum)"></div><p class="lb">Murasaki plum<br>#754E75 · 6.6:1</p></div>
<div><div class="sw" style="background:var(--wend-plum-tint)"></div><p class="lb">Plum tint<br>#B497B4</p></div>
<div><div class="sw" style="background:var(--wend-plum-wash)"></div><p class="lb">Plum wash<br>#EFE7EF</p></div>
</div></body></html>
