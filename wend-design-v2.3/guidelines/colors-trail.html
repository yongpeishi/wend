<!-- @dsCard group="Colors" viewport="700x160" name="Trail states" subtitle="The four stop states, in narrative order" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:20px}
.sw{height:76px;border-radius:4px}.lb{margin:8px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);line-height:1.5}
.row{display:grid;gap:12px}</style></head><body>
<div style="display:flex;align-items:center;gap:28px">
<div style="text-align:center"><div style="width:34px;height:34px;border-radius:50%;background:var(--stop-decided);margin:0 auto"></div><p class="lb">Decided</p></div>
<div style="text-align:center"><div style="width:34px;height:34px;border-radius:50%;background:var(--surface-card);border:4px solid var(--stop-open);margin:0 auto"></div><p class="lb">Open · you are here</p></div>
<div style="text-align:center"><div style="width:30px;height:30px;border-radius:50%;background:var(--stop-waiting);margin:0 auto"></div><p class="lb">Waiting</p></div>
<div style="text-align:center"><div style="width:30px;height:30px;border-radius:50%;background:var(--stop-destination);margin:0 auto"></div><p class="lb">Destination</p></div>
</div></body></html>
