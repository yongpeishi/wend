<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style> body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); } </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Button, Chip, Input } = window.Wend;
function Card() {
  return (
    <div style={{ padding: 24, display: 'grid', gap: 20 }}>
      <div style={{ display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' }}>
        <Button>Take the long way</Button>
        <Button variant="secondary">Widen again</Button>
        <Button variant="quiet">Skip</Button>
      </div>
      <div style={{ display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' }}>
        <Button focused>Focused</Button>
        <Button disabled>Disabled</Button>
        <div style={{ background: 'var(--surface-inverse)', padding: 10, borderRadius: 'var(--radius-card)' }}>
          <Button variant="onDark">Widen this day again</Button>
        </div>
      </div>
      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
        <Chip selected>Temples</Chip>
        <Chip>Food</Chip>
        <Chip>Walks</Chip>
        <Chip tone="saved">Saved · 12</Chip>
      </div>
      <div style={{ display: 'grid', gap: 10, maxWidth: 420 }}>
        <Input placeholder="Where are you going?" hint="↵" />
        <Input value="Kyoto" focused />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card />);
</script>
</body>
</html>
