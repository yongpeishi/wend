<!-- @dsCard group="Spacing" viewport="700x160" name="Radius & hit area" subtitle="Cards 12, media 10, pills full, stops circular — no shadows" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:20px}
.sw{height:76px;border-radius:4px}.lb{margin:8px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);line-height:1.5}
.row{display:grid;gap:12px}</style></head><body>
<div style="display:flex;align-items:center;gap:14px">
<div style="width:64px;height:48px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card)"></div>
<div style="width:64px;height:48px;background:var(--placeholder-hatch);border-radius:var(--radius-media)"></div>
<div style="width:96px;height:48px;background:var(--action-primary);border-radius:var(--radius-pill)"></div>
<div style="width:48px;height:48px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:50%"></div>
</div>
<p class="lb">Tap targets ≥ 48×48 on touch, ≥ 32×32 on pointer. Elevation is page tone vs card tone.</p></body></html>
