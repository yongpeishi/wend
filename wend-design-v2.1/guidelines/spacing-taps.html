<!-- @dsCard group="Spacing" viewport="700x160" name="Tap targets" subtitle="48×48 minimum on touch, even for the small dots" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:20px}
.lb{margin:8px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);line-height:1.5}</style></head><body>
<div style="display:flex;gap:24px;align-items:center">
<div style="width:48px;height:48px;border:1.5px dashed var(--border-strong);border-radius:50%;display:flex;align-items:center;justify-content:center"><span style="width:22px;height:22px;border-radius:50%;background:var(--stop-destination);display:block"></span></div>
<div style="width:48px;height:48px;border:1.5px dashed var(--border-strong);border-radius:50%;display:flex;align-items:center;justify-content:center"><span style="width:22px;height:22px;border-radius:50%;border:2px solid var(--border-strong);display:block"></span></div>
<div style="height:48px;padding:0 26px;background:var(--action-primary);color:var(--action-primary-text);border-radius:var(--radius-pill);display:flex;align-items:center;font-weight:700;font-size:15px">Keep both for now</div>
<div style="width:32px;height:32px;border:1.5px dashed var(--border-strong);border-radius:50%"></div>
</div>
<p class="lb">Dashed = hit area. Touch 48 minimum · pointer never below 32</p>
</body></html>
