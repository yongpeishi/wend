<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:20px}
.sw{height:76px;border-radius:4px}.lb{margin:8px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);line-height:1.5}
.row{display:grid;gap:12px}</style></head><body>
<div class="row" style="grid-template-columns:repeat(3,1fr)">
<div><div class="sw" style="background:var(--wend-deep-leaf)"></div><p class="lb">Deep leaf<br>#2F4A36 · 8.7:1</p></div>
<div><div class="sw" style="background:var(--wend-leaf)"></div><p class="lb">Leaf green<br>#3F6B4A · 5.5:1</p></div>
<div><div class="sw" style="background:var(--wend-leaf-soft)"></div><p class="lb">Leaf soft<br>#8FAE93 · on dark only</p></div>
</div></body></html>
