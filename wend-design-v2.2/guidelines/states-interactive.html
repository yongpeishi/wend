<!-- @dsCard group="Brand" viewport="700x170" name="States" subtitle="Hover and press are opacity only; focus is always the apricot ring" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:20px}
.lb{margin:8px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);line-height:1.5}.b{height:48px;padding:0 26px;background:var(--action-primary);color:var(--action-primary-text);border-radius:var(--radius-card);display:flex;align-items:center;font-weight:700;font-size:15px}</style></head><body>
<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
<div class="b">Rest</div>
<div class="b" style="opacity:.82">Hover · .82</div>
<div class="b" style="opacity:.66">Press · .66</div>
<div class="b" style="outline:var(--focus-width) solid var(--focus-ring);outline-offset:var(--focus-offset)">Focus</div>
<div class="b" style="background:var(--surface-disabled);color:var(--action-disabled-text)">Disabled</div>
</div>
<p class="lb">The palette never lightens or darkens. Nothing is struck through — nothing is rejected.</p>
</body></html>
