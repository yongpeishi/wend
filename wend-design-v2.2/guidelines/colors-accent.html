<!-- @dsCard group="Colors" viewport="700x150" name="Accent & state" subtitle="Apricot means "the pass you are in"; plum means destination" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:20px}
.sw{height:76px;border-radius:4px}.lb{margin:8px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);line-height:1.5}
.row{display:grid;gap:12px}</style></head><body>
<div class="row" style="grid-template-columns:repeat(4,1fr)">
<div><div class="sw" style="background:var(--wend-apricot)"></div><p class="lb">Apricot<br>#E89A5E · non-text only</p></div>
<div><div class="sw" style="background:var(--wend-plum)"></div><p class="lb">Plum<br>#8A4A61 · 5.8:1</p></div>
<div><div class="sw" style="background:var(--wend-plum-tint)"></div><p class="lb">Plum tint<br>#E4B5C4</p></div>
<div><div class="sw" style="background:var(--wend-plum-wash)"></div><p class="lb">Plum wash<br>#F3E3EA</p></div>
</div></body></html>
