<!-- @dsCard group="Brand" viewport="700x180" name="Voice" subtitle="Playful, forgiving, fond of detours — second person, sentence case, no emoji" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:20px}
.lb{margin:8px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);line-height:1.5}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
<div style="display:grid;gap:8px">
<span style="font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--stop-decided)">Yes</span>
<p style="margin:0;font-size:15px;line-height:1.6;color:var(--text-strong)">You'll get there. Slowly is fine.</p>
<p style="margin:0;font-size:15px;line-height:1.6;color:var(--text-strong)">Kept — it's waiting in your shortlist.</p>
<p style="margin:0;font-size:15px;line-height:1.6;color:var(--text-strong)">Take the long way</p>
</div>
<div style="display:grid;gap:8px">
<span style="font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)">No</span>
<p style="margin:0;font-size:15px;line-height:1.6;color:var(--text-muted)">Optimise your itinerary now.</p>
<p style="margin:0;font-size:15px;line-height:1.6;color:var(--text-muted)">You haven't finished your trip!</p>
<p style="margin:0;font-size:15px;line-height:1.6;color:var(--text-muted)">Only 2 spots left</p>
</div>
</div>
</body></html>
