<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Paper, card, line, and the two text greys" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:20px}
.sw{height:76px;border-radius:4px}.lb{margin:8px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);line-height:1.5}
.row{display:grid;gap:12px}</style></head><body>
<div class="row" style="grid-template-columns:repeat(5,1fr)">
<div><div class="sw" style="background:var(--wend-paper);border:1px solid var(--border-subtle)"></div><p class="lb">Paper<br>#F0F3EE</p></div>
<div><div class="sw" style="background:var(--wend-card);border:1px solid var(--border-subtle)"></div><p class="lb">Card<br>#FBFCFA</p></div>
<div><div class="sw" style="background:var(--wend-line)"></div><p class="lb">Line<br>#D2DACD</p></div>
<div><div class="sw" style="background:var(--wend-muted)"></div><p class="lb">Muted<br>#6A7565 · 4.9:1</p></div>
<div><div class="sw" style="background:var(--wend-body)"></div><p class="lb">Body<br>#4B5548 · 7.3:1</p></div>
</div></body></html>
