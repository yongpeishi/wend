<!-- @dsCard group="Spacing" viewport="700x160" name="Borders" subtitle="1.5px subtle, 2px when the border carries an action" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);padding:20px}
.lb{margin:8px 0 0;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);line-height:1.5}</style></head><body>
<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">
<div style="width:150px;height:64px;background:var(--surface-card);border:var(--border-width) solid var(--border-subtle);border-radius:var(--radius-card)"></div>
<div style="width:150px;height:64px;background:var(--surface-card);border:var(--border-width) solid var(--border-strong);border-radius:var(--radius-card)"></div>
<div style="width:150px;height:64px;border:var(--border-width-strong) solid var(--action-primary);border-radius:var(--radius-pill)"></div>
<div style="width:150px;height:64px;background:var(--surface-card);border-radius:var(--radius-card)"></div>
</div>
<p class="lb">1.5 subtle · 1.5 strong · 2 action · none (tone only — no shadows anywhere)</p>
</body></html>
