<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:flex;font-family:var(--font-sans)}
.main{flex:1;background:var(--wend-deep-leaf);display:flex;align-items:center;justify-content:center}
.word{font-weight:700;font-size:150px;letter-spacing:0.26em;text-transform:uppercase;color:var(--wend-paper);line-height:1;padding-left:0.26em}
.strip{width:25%;display:flex;flex-direction:column}.strip div{flex:1}</style></head>
<body><div class="main"><span class="word">Wend</span></div>
<div class="strip"><div style="background:var(--wend-apricot)"></div><div style="background:var(--wend-leaf-soft)"></div><div style="background:var(--wend-leaf)"></div><div style="background:var(--wend-plum)"></div></div>
</body></html>
